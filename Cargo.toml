[package]
name = "battle-chess-3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native local 3D Battle Chess built with Bevy"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
bevy = { version = "0.19.1", default-features = false, features = [
  "std",
  "bevy_log",
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_window",
  "bevy_winit",
  "mouse",
  "keyboard",
  "png",
  "tonemapping_luts",
  "zstd_rust",
  "x11",
  "wayland"
] }
bevy_egui = { version = "0.42.0", default-features = false, features = ["default_fonts", "render"] }
shakmaty = "0.30.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
